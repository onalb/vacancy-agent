name: deploy

on:
  push:
    branches: [main]
    paths:
      - "vacancy_agent/**"
      - "static/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: vacancy-agent-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACR_NAME: ca3f7576b2d7acr
      APP_NAME: vacancy-agent
      APP_RG: vacancy-agent-rg
      APP_ENV: vacancy-env
      FOUNDRY_ACCOUNT: onalb-vacancy
      FOUNDRY_PROJECT: vacancy
      FOUNDRY_USER_ROLE: 53ca6127-db72-4b80-b1b0-d745d6d5456d
      OWNER_EMAIL: development.onalb@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 2f043933-3315-4270-93b1-9c87fc9a4951
          tenant-id: 38cb4bd4-0565-4999-a1a2-c30adbf01109
          subscription-id: 9a3fa83f-b845-480a-a09d-659bce1adfca

      - name: Remediate Azure access
        run: |
          set -euo pipefail

          echo "::group::Register Microsoft.CognitiveServices"
          state="$(az provider show -n Microsoft.CognitiveServices --query registrationState -o tsv 2>/dev/null || echo Unknown)"
          echo "Microsoft.CognitiveServices=$state"
          if [ "$state" != "Registered" ]; then
            az provider register --namespace Microsoft.CognitiveServices || true
          fi
          echo "::endgroup::"

          echo "::group::Open ACR public network access"
          az acr update -n "$ACR_NAME" --public-network-enabled true || true
          az acr update -n "$ACR_NAME" --default-action Allow 2>/dev/null || true
          az acr show -n "$ACR_NAME" --query "{publicNetworkAccess:publicNetworkAccess,loginServer:loginServer}" -o jsonc || true
          echo "::endgroup::"

          echo "::group::Assign Foundry User to owner"
          acct_id="$(az resource list --name "$FOUNDRY_ACCOUNT" --resource-type Microsoft.CognitiveServices/accounts --query "[0].id" -o tsv 2>/dev/null || true)"
          echo "Foundry account id: ${acct_id:-<not found>}"
          if [ -n "$acct_id" ]; then
            for scope in "$acct_id/projects/$FOUNDRY_PROJECT" "$acct_id"; do
              az role assignment create \
                --role "$FOUNDRY_USER_ROLE" \
                --assignee "$OWNER_EMAIL" \
                --scope "$scope" \
                2>&1 || true
            done
          fi
          echo "::endgroup::"

          echo "::group::Container App / Environment status"
          az containerapp show -n "$APP_NAME" -g "$APP_RG" -o jsonc || true
          az containerapp env show -n "$APP_ENV" -g "$APP_RG" \
            --query "{name:name,provisioningState:properties.provisioningState,staticIp:properties.staticIp,defaultDomain:properties.defaultDomain}" \
            -o jsonc || true
          echo "::endgroup::"

      - name: Build and push
        env:
          IMAGE: ca3f7576b2d7acr.azurecr.io/vacancy-agent:${{ github.sha }}
        run: |
          set -euo pipefail
          token="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
          echo "::add-mask::$token"
          printf '%s\n' "$token" | docker login "${ACR_NAME}.azurecr.io" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Roll or recreate Container App
        run: |
          set -euo pipefail

          state="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.provisioningState -o tsv 2>/dev/null || echo Missing)"
          fqdn="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
          echo "Current provisioningState=$state fqdn=${fqdn:-<none>}"

          # Prefer a bounded update; Failed/Missing apps get recreated.
          if [ "$state" = "Succeeded" ] || [ "$state" = "InProgress" ]; then
            echo "Attempting bounded update..."
            set +e
            timeout 180 az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$APP_RG" \
              --image "$IMAGE" \
              --min-replicas 1 \
              --max-replicas 3 \
              --query "properties.latestRevisionName" \
              --output tsv
            update_rc=$?
            set -e
            if [ "$update_rc" -eq 0 ]; then
              echo "Update succeeded"
            else
              echo "Update failed or timed out (rc=$update_rc); will recreate"
              state="Failed"
            fi
          fi

          if [ "$state" != "Succeeded" ] && [ "$state" != "InProgress" ]; then
            echo "Recreating container app from $IMAGE"
            # Best-effort delete of the broken app
            timeout 120 az containerapp delete -n "$APP_NAME" -g "$APP_RG" --yes 2>&1 || true

            # Enable admin user briefly for pull during create
            az acr update -n "$ACR_NAME" --admin-enabled true 2>&1 || true
            ACR_USER="$(az acr credential show -n "$ACR_NAME" --query username -o tsv)"
            ACR_PASS="$(az acr credential show -n "$ACR_NAME" --query 'passwords[0].value' -o tsv)"
            echo "::add-mask::$ACR_PASS"

            timeout 300 az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$APP_RG" \
              --environment "$APP_ENV" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --transport auto \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 0.5 \
              --memory 1.0Gi \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --query "properties.configuration.ingress.fqdn" \
              -o tsv
          fi

          echo "::group::Post-roll status"
          for i in $(seq 1 24); do
            az containerapp show -n "$APP_NAME" -g "$APP_RG" \
              --query "{runningStatus:properties.runningStatus,provisioningState:properties.provisioningState,latestRevision:properties.latestRevisionName,fqdn:properties.configuration.ingress.fqdn}" \
              -o jsonc || true
            fqdn="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true)"
            if [ -n "$fqdn" ]; then
              code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://$fqdn/api/health" || echo 000)"
              echo "Probe https://$fqdn/api/health -> $code"
              cat /tmp/health.json 2>/dev/null || true
              echo
              if [ "$code" = "200" ]; then
                break
              fi
            fi
            sleep 10
          done
          az containerapp revision list -n "$APP_NAME" -g "$APP_RG" -o table || true
          echo "::endgroup::"
