name: deploy

on:
  push:
    branches: [main]
    paths:
      - "vacancy_agent/**"
      - "static/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: vacancy-agent-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: vacancy-agent
      APP_RG: vacancy-agent-rg
      APP_ENV: vacancy-env
      GHCR_SERVER: ghcr.io
      GHCR_USER: ${{ github.repository_owner }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/vacancy-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 2f043933-3315-4270-93b1-9c87fc9a4951
          tenant-id: 38cb4bd4-0565-4999-a1a2-c30adbf01109
          subscription-id: 9a3fa83f-b845-480a-a09d-659bce1adfca

      - name: Build and push GHCR image (Docker v2, no OCI attestations)
        run: |
          set -euo pipefail
          # ACA often fails to start revisions from OCI-index/attestation manifests.
          docker buildx create --use --name vacancy-builder >/dev/null 2>&1 || docker buildx use vacancy-builder
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --provenance=false \
            --sbom=false \
            --platform linux/amd64 \
            -f Dockerfile \
            -t "$IMAGE" \
            -t "ghcr.io/${{ github.repository_owner }}/vacancy-agent:latest" \
            --push \
            .
          # Ensure package is public so pulls keep working after GITHUB_TOKEN expires
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/vacancy-agent/visibility" \
            -f visibility=public \
            || true

      - name: Roll Container App with fresh GHCR pull credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          key_len="${#OPENAI_API_KEY}"
          echo "OPENAI_API_KEY length=${key_len}"
          if [ "$key_len" -lt 20 ]; then
            echo "::error::OPENAI_API_KEY GitHub secret missing or too short"
            exit 1
          fi

          expected_version="$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("vacancy_agent/__init__.py").read_text()
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )"
          echo "Expected version: $expected_version image: $IMAGE"

          exists="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query name -o tsv 2>/dev/null || true)"

          # CRITICAL: refresh GHCR registry password every deploy.
          # A stored GITHUB_TOKEN from an earlier run expires; new revisions then cannot pull.
          if [ -n "$exists" ]; then
            echo "Refreshing GHCR registry credentials"
            az containerapp registry set \
              -n "$APP_NAME" -g "$APP_RG" \
              --server "$GHCR_SERVER" \
              --username "$GHCR_USER" \
              --password "$GHCR_TOKEN"
            printf '%s' "$OPENAI_API_KEY" > /tmp/openai_api_key.value
            az containerapp secret set -n "$APP_NAME" -g "$APP_RG" \
              --secrets "openai-api-key=$(cat /tmp/openai_api_key.value)"
            rm -f /tmp/openai_api_key.value
            az containerapp identity assign -n "$APP_NAME" -g "$APP_RG" --system-assigned >/dev/null || true

            echo "Updating image + env on existing app"
            az containerapp update -n "$APP_NAME" -g "$APP_RG" \
              --image "$IMAGE" \
              --min-replicas 1 \
              --max-replicas 3 \
              --replace-env-vars \
                "FOUNDRY_PROJECT_ENDPOINT=https://onalb-vacancy.services.ai.azure.com/api/projects/vacancy" \
                "FOUNDRY_MODEL=vacancy-chat" \
                "AZURE_STORAGE_ACCOUNT=onalbvacancy" \
                "AZURE_STORAGE_CONTAINER=fits" \
                "CAPABILITIES_GATEWAY_URL=https://39pjmmgrnu.us-east-1.awsapprunner.com" \
                "OPENAI_API_KEY=secretref:openai-api-key" \
              -o jsonc
          else
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$APP_RG" \
              --environment "$APP_ENV" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --transport auto \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --registry-server "$GHCR_SERVER" \
              --registry-username "$GHCR_USER" \
              --registry-password "$GHCR_TOKEN" \
              --secrets "openai-api-key=$OPENAI_API_KEY" \
              --env-vars \
                "FOUNDRY_PROJECT_ENDPOINT=https://onalb-vacancy.services.ai.azure.com/api/projects/vacancy" \
                "FOUNDRY_MODEL=vacancy-chat" \
                "AZURE_STORAGE_ACCOUNT=onalbvacancy" \
                "AZURE_STORAGE_CONTAINER=fits" \
                "CAPABILITIES_GATEWAY_URL=https://39pjmmgrnu.us-east-1.awsapprunner.com" \
                "OPENAI_API_KEY=secretref:openai-api-key" \
              -o jsonc
            az containerapp identity assign -n "$APP_NAME" -g "$APP_RG" --system-assigned >/dev/null || true
          fi

          az containerapp revision set-mode -n "$APP_NAME" -g "$APP_RG" --mode single || true

          # Wait until latest revision is the ready revision (new image actually started)
          latest=""
          ready=""
          for i in $(seq 1 36); do
            latest="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.latestRevisionName -o tsv)"
            ready="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.latestReadyRevisionName -o tsv)"
            echo "wait-ready $i: latest=$latest ready=$ready"
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$latest" ] || [ "$latest" != "$ready" ]; then
            echo "::error::New revision $latest never became ready (ready=$ready). Likely image pull failure."
            az containerapp revision list -n "$APP_NAME" -g "$APP_RG" -o table || true
            az containerapp revision show -n "$APP_NAME" -g "$APP_RG" --revision "$latest" -o jsonc || true
            exit 1
          fi

          # Deactivate every non-latest revision so stale 0.1.4 cannot keep answering
          while read -r rev; do
            [ -z "$rev" ] && continue
            if [ "$rev" != "$latest" ]; then
              echo "Deactivating old revision $rev"
              az containerapp revision deactivate -n "$APP_NAME" -g "$APP_RG" --revision "$rev" 2>&1 || true
            fi
          done < <(az containerapp revision list -n "$APP_NAME" -g "$APP_RG" --query "[].name" -o tsv 2>/dev/null || true)

          fqdn="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "FQDN=$fqdn serving revision=$latest"
          ok=0
          for i in $(seq 1 36); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://$fqdn/api/health" || echo 000)"
            body="$(cat /tmp/health.json 2>/dev/null || true)"
            echo "probe $i: $code $body"
            if [ "$code" = "200" ] && echo "$body" | grep -q "\"version\":\"$expected_version\"" && echo "$body" | grep -q '"openai_key_set":true'; then
              js="$(curl -sS --max-time 15 "https://$fqdn/static/app.js" | head -1 || true)"
              echo "static/app.js first line: $js"
              if echo "$js" | grep -q "$expected_version"; then
                ok=1
                break
              fi
              echo "API version ok but UI JS not updated yet"
            fi
            sleep 10
          done

          az containerapp revision list -n "$APP_NAME" -g "$APP_RG" -o table || true
          az containerapp show -n "$APP_NAME" -g "$APP_RG" \
            --query "{image:properties.template.containers[0].image,latestRevision:properties.latestRevisionName,latestReady:properties.latestReadyRevisionName,runningStatus:properties.runningStatus}" \
            -o jsonc

          if [ "$ok" != "1" ]; then
            echo "::error::Live app did not serve version=$expected_version with openai_key_set=true"
            exit 1
          fi
          echo "Deploy verified: version=$expected_version openai_key_set=true"
