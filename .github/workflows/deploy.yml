name: deploy

on:
  push:
    branches: [main]
    paths:
      - "vacancy_agent/**"
      - "static/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: vacancy-agent-deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACR_NAME: ca3f7576b2d7acr
      APP_NAME: vacancy-agent
      APP_RG: vacancy-agent-rg
      APP_ENV: vacancy-env
      FOUNDRY_ACCOUNT: onalb-vacancy
      FOUNDRY_PROJECT: vacancy
      FOUNDRY_USER_ROLE: 53ca6127-db72-4b80-b1b0-d745d6d5456d
      OWNER_EMAIL: development.onalb@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: 2f043933-3315-4270-93b1-9c87fc9a4951
          tenant-id: 38cb4bd4-0565-4999-a1a2-c30adbf01109
          subscription-id: 9a3fa83f-b845-480a-a09d-659bce1adfca

      - name: Diagnose Azure resources
        run: |
          set -euo pipefail
          echo "::group::Subscription / providers"
          az account show -o jsonc
          az provider show -n Microsoft.CognitiveServices --query registrationState -o tsv || true
          az provider show -n Microsoft.App --query registrationState -o tsv || true
          az provider show -n Microsoft.ContainerRegistry --query registrationState -o tsv || true
          echo "::endgroup::"

          echo "::group::ACR discovery"
          az acr list -o table || true
          az resource list --resource-type Microsoft.ContainerRegistry/registries -o table || true
          az acr show -n "$ACR_NAME" -o jsonc || true
          az acr list-deleted -o table 2>/dev/null || true
          echo "::endgroup::"

          echo "::group::Container App / Env"
          az containerapp env show -n "$APP_ENV" -g "$APP_RG" -o jsonc || true
          az containerapp show -n "$APP_NAME" -g "$APP_RG" -o jsonc || true
          az containerapp revision list -n "$APP_NAME" -g "$APP_RG" -o table || true
          echo "::endgroup::"

          # Foundry role (best effort)
          acct_id="$(az resource list --name "$FOUNDRY_ACCOUNT" --resource-type Microsoft.CognitiveServices/accounts --query "[0].id" -o tsv 2>/dev/null || true)"
          if [ -n "$acct_id" ]; then
            az role assignment create --role "$FOUNDRY_USER_ROLE" --assignee "$OWNER_EMAIL" --scope "$acct_id" 2>&1 || true
            az role assignment create --role "$FOUNDRY_USER_ROLE" --assignee "$OWNER_EMAIL" --scope "$acct_id/projects/$FOUNDRY_PROJECT" 2>&1 || true
          fi

      - name: Build and push
        env:
          IMAGE: ca3f7576b2d7acr.azurecr.io/vacancy-agent:${{ github.sha }}
        run: |
          set -euo pipefail
          token="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
          echo "::add-mask::$token"
          printf '%s\n' "$token" | docker login "${ACR_NAME}.azurecr.io" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Wait, then update or recreate app
        run: |
          set -euo pipefail

          wait_until_idle() {
            local max_rounds="${1:-40}"
            local state="Missing"
            for i in $(seq 1 "$max_rounds"); do
              state="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.provisioningState -o tsv 2>/dev/null || echo Missing)"
              echo "[wait $i/$max_rounds] provisioningState=$state" >&2
              if [ "$state" != "InProgress" ]; then
                printf '%s' "$state"
                return 0
              fi
              sleep 30
            done
            state="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.provisioningState -o tsv 2>/dev/null || echo Missing)"
            printf '%s' "$state"
          }

          ensure_acr_arm() {
            # Prefer existing registry; recreate if ARM lost it but login server still works.
            if az acr show -n "$ACR_NAME" >/dev/null 2>&1; then
              az acr show -n "$ACR_NAME" --query id -o tsv
              return 0
            fi
            echo "ACR ARM record missing; checking soft-delete / recreating"
            deleted="$(az acr list-deleted --query "[?name=='$ACR_NAME'].id | [0]" -o tsv 2>/dev/null || true)"
            if [ -n "$deleted" ]; then
              echo "Restoring soft-deleted ACR $deleted"
              az acr create -n "$ACR_NAME" -g "$APP_RG" --sku Basic --location eastus 2>/dev/null || true
              # restore API
              az resource create -g "$APP_RG" --resource-type Microsoft.ContainerRegistry/registries \
                -n "$ACR_NAME" --is-full-object false \
                --properties '{}' 2>/dev/null || true
              az rest --method put \
                --url "https://management.azure.com$(az group show -n "$APP_RG" --query id -o tsv)/providers/Microsoft.ContainerRegistry/registries/${ACR_NAME}?api-version=2023-01-01-preview" \
                --body "{\"location\":\"eastus\",\"sku\":{\"name\":\"Basic\"},\"properties\":{}}" 2>&1 || true
            fi
            if ! az acr show -n "$ACR_NAME" >/dev/null 2>&1; then
              echo "Creating new ACR $ACR_NAME in $APP_RG"
              az acr create -n "$ACR_NAME" -g "$APP_RG" --sku Basic --location eastus --admin-enabled true
            fi
            az acr update -n "$ACR_NAME" --public-network-enabled true || true
            az acr show -n "$ACR_NAME" --query id -o tsv
          }

          final_state="$(wait_until_idle 40)"
          echo "Idle/final state: $final_state"

          if [ "$final_state" = "Succeeded" ]; then
            echo "Updating existing app image to $IMAGE"
            az containerapp update \
              -n "$APP_NAME" \
              -g "$APP_RG" \
              --image "$IMAGE" \
              --min-replicas 1 \
              --max-replicas 3 \
              -o jsonc
          else
            echo "App state=$final_state — recreating"
            # Do not interrupt an InProgress delete/create with a hard fail; try delete then create.
            timeout 180 az containerapp delete -n "$APP_NAME" -g "$APP_RG" --yes 2>&1 || true
            sleep 20
            wait_until_idle 20 >/dev/null || true

            acr_id="$(ensure_acr_arm)"
            echo "ACR id: $acr_id"

            # Re-push in case we recreated ACR
            token="$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)"
            echo "::add-mask::$token"
            printf '%s\n' "$token" | docker login "${ACR_NAME}.azurecr.io" \
              --username 00000000-0000-0000-0000-000000000000 \
              --password-stdin
            docker push "$IMAGE"

            az acr update -n "$ACR_NAME" --admin-enabled true
            ACR_USER="$(az acr credential show -n "$ACR_NAME" --query username -o tsv)"
            ACR_PASS="$(az acr credential show -n "$ACR_NAME" --query 'passwords[0].value' -o tsv)"
            echo "::add-mask::$ACR_PASS"

            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$APP_RG" \
              --environment "$APP_ENV" \
              --image "$IMAGE" \
              --target-port 8000 \
              --ingress external \
              --transport auto \
              --min-replicas 1 \
              --max-replicas 3 \
              --cpu 1.0 \
              --memory 2.0Gi \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-username "$ACR_USER" \
              --registry-password "$ACR_PASS" \
              --env-vars \
                "FOUNDRY_PROJECT_ENDPOINT=https://onalb-vacancy.services.ai.azure.com/api/projects/vacancy" \
                "FOUNDRY_MODEL=vacancy-chat" \
                "AZURE_STORAGE_ACCOUNT=onalbvacancy" \
                "AZURE_STORAGE_CONTAINER=fits" \
                "CAPABILITIES_GATEWAY_URL=https://39pjmmgrnu.us-east-1.awsapprunner.com" \
              -o jsonc
          fi

          echo "::group::Health probes"
          fqdn="$(az containerapp show -n "$APP_NAME" -g "$APP_RG" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "FQDN=$fqdn"
          ok=0
          for i in $(seq 1 36); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "https://$fqdn/api/health" || echo 000)"
            echo "probe $i: $code $(head -c 120 /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          az containerapp show -n "$APP_NAME" -g "$APP_RG" \
            --query "{runningStatus:properties.runningStatus,provisioningState:properties.provisioningState,latestRevision:properties.latestRevisionName,fqdn:properties.configuration.ingress.fqdn}" \
            -o jsonc
          az containerapp revision list -n "$APP_NAME" -g "$APP_RG" -o table || true
          echo "::endgroup::"
          if [ "$ok" != "1" ]; then
            echo "Health check did not return 200"
            exit 1
          fi
